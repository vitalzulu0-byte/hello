<!DOCTYPE html>
<html>
<body>
  <p>Enter your name:</p>
  <input id="name">
  <button onclick="run()">Run</button>
  <h2 id="out"></h2>

  <script>
    function run() {
      var name = document.getElementById("name").value;
      document.getElementById("out").textContent =
        "Hello!!! " + name + ", "Hello!! " + name + ", Welcome to Vitals page, keep learning and keep growing!";
    }
  </script>
</body>
</html>
