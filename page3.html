<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vital's Page</title>
  <style>
    body { font-family: Arial; background: #f2f6fa; margin: 0; padding: 16px; }
    .card { background: white; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
    h1 { text-align: center; color: #1a4d8f; }
    input, button { font-size: 16px; padding: 8px; margin: 4px 0; }
    button { background: #1a4d8f; color: white; border: none; border-radius: 6px; }
    a.btn { display: block; background: #25a244; color: white; text-decoration: none;
            padding: 10px; border-radius: 6px; margin: 8px 0; text-align: center; }
  </style>
</head>
<body>
  <h1>Welcome to Vital's Page</h1>

  <div class="card">
    <h2>About me</h2>
    <p>Student at Chipata Trades Training Institute, studying Computer Studies.</p>
  </div>

  <div class="card">
    <h2>Say hello</h2>
    <input id="name" placeholder="Enter your name">
    <button onclick="run()">Run</button>
    <h3 id="out"></h3>
  </div>

  <div class="card">
    <h2>Calculator</h2>
    <input id="a" type="number" placeholder="First number"><br>
    <input id="b" type="number" placeholder="Second number"><br>
    <button onclick="calc('+')">+</button>
    <button onclick="calc('-')">-</button>
    <button onclick="calc('*')">×</button>
    <button onclick="calc('/')">÷</button>
    <h3 id="result"></h3>
  </div>

  <div class="card">
    <h2>Contact me</h2>
    <a class="btn" href="https://wa.me/26770642021">WhatsApp me</a>
    <a class="btn" href="tel:+260770642021">Call me</a>
  </div>

  <script>
    function run() {
      var name = document.getElementById("name").value;
      document.getElementById("out").textContent =
        "Hello!! " + name + ", welcome to Vitals page, keep learning, keep growing!";
    }
    function calc(op) {
      var a = Number(document.getElementById("a").value);
      var b = Number(document.getElementById("b").value);
      var r;
      if (op == '+') r = a + b;
      if (op == '-') r = a - b;
      if (op == '*') r = a * b;
      if (op == '/') r = b == 0 ? "Cannot divide by 0" : a / b;
      document.getElementById("result").textContent = "Answer: " + r;
    }
  </script>
</body>
</html>
